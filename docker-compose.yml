services:
  api:
    build:
      context: ./backend
      dockerfile: dockerfile
    # Dev runs a runtime `npm install` into bind-mounted/anonymous volumes, which
    # the image's non-root `node` user can't write to. Override to root for dev
    # only — the production image (docker-compose.prod.yml) keeps the node user.
    user: root
    depends_on:
      mongo_madness:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
    environment:
      - ENV=docker
      - PORT=8071
      - SERVICE_BASE_URL=http://localhost:8071
      - UI_BASE_URL=http://localhost:4200
      - CONNECTION_STRING=mongodb://${MONGODB_INITDB_ROOT_USERNAME}:${MONGODB_INITDB_ROOT_PASSWORD}@mongo_madness:27017/momenta?replicaSet=rs0&authSource=admin
      - REDIS_HOST=redis-node-1
      - REDIS_PORT=6379

      - JWT_SECRET=${JWT_SECRET}
      - DELIVERED_JWT_SECRET=${DELIVERED_JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - GIPHY_API_KEY=${GIPHY_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - DEFAULT_USER_PASS=${DEFAULT_USER_PASS}
      - DISABLE_ACCESS_WHITELIST=${DISABLE_ACCESS_WHITELIST}
    volumes:
      - ./backend:/backend
      - /backend/node_modules
      - ./frontend/src/assets:/backend/assets
      - ${MEDIA_FILE_PATH}:/root
    command: bash -c "npm install && npm run dev"
    ports:
      - "8071:8071"
    # expose:
    #   - "8071"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8071/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - momenta-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M

  ui:
    build:
      context: ./frontend
      dockerfile: dockerfile
    depends_on:
      - api
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: npm run start
    ports:
      - "4200:4200"
    restart: unless-stopped
    networks:
      - momenta-network

  mongo_madness:
    image: mongo:latest
    environment:
      # Official image vars are MONGO_INITDB_ROOT_* (no "DB") — the entrypoint
      # only creates the root user when these exact names are present.
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_INITDB_ROOT_PASSWORD}
    # Single-node replica set so Mongoose transactions work in dev too, now with
    # auth enabled. A replica set requires a keyfile for internal member auth even
    # at size 1 — we generate it into a named volume at startup (container-native
    # ext4 perms, so this works on Windows hosts where a bind-mounted keyfile would
    # be rejected for "permissions too open"). The root user is created by the
    # official entrypoint from MONGODB_INITDB_ROOT_* on first init.
    command:
      - bash
      - -c
      - |
        set -e
        KF=/data/keyfile/mongo-keyfile
        mkdir -p /data/keyfile
        if [ ! -f "$$KF" ]; then head -c 756 /dev/urandom | base64 | tr -d '\n' > "$$KF"; fi
        chmod 400 "$$KF"
        chown 999:999 "$$KF"
        exec docker-entrypoint.sh mongod --auth --keyFile "$$KF" --port 27017 --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 2
    expose:
      - 27017
    volumes:
      - type: volume
        source: mongodb_data_volume
        target: /data/db
      - type: volume
        source: mongodb_keyfile_volume
        target: /data/keyfile
    restart: unless-stopped
    healthcheck:
      test: >
        mongosh --quiet --port 27017 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo_madness:27017'}]}) }"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - momenta-network
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: "1.0"
        reservations:
          memory: 1G

  mongo_madness_ui:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGODB_INITDB_ROOT_USERNAME}:${MONGODB_INITDB_ROOT_PASSWORD}@mongo_madness:27017/${DB_SCHEMA}?authSource=admin
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_INITDB_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_INITDB_ROOT_PASSWORD}
      - ME_CONFIG_BASICAUTH_USERNAME=${DB_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${DB_PASSWORD}
      - ME_CONFIG_SITE_BASEURL=/${DB_BASEURL}
    depends_on:
      - mongo_madness
    links:
      - mongo_madness
    ports:
      - "8073:8081"
    restart: unless-stopped   
    networks:
      - momenta-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M

  redis-node-1:
    image: redis:7.2.4
    restart: unless-stopped
    expose:
      - "8074"
    networks:
      - momenta-network
    hostname: redis-node-1
    volumes:
      - ./redis/redis.config:/redis/redis.conf
    command: redis-server /redis/redis.conf --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped
    networks:
      - momenta-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - momenta-network

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    networks:
      - momenta-network

volumes:
  mongodb_data_volume:
  mongodb_keyfile_volume:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:

networks:
  momenta-network:
    driver: bridge
