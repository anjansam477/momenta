<div class="notification-dropdown dropdown">
  <button
    class="notification-trigger"
    type="button"
    title="Notifications"
    id="notificationsDropdown"
    data-bs-toggle="dropdown"
    aria-expanded="false">
    <i class="bi bi-bell-fill"></i>
    <span *ngIf="unreadNotificationCount() > 0" class="notification-dot">{{ unreadNotificationCount() }}</span>
  </button>

  <div class="dropdown-menu dropdown-menu-end notification-wrapper" aria-labelledby="notificationsDropdown" (click)="$event.stopPropagation()">
    <div class="notification-header">
      <div>
        <span class="eyebrow">Activity</span>
        <h4>Notifications</h4>
      </div>
      <div *ngIf="notifications.length !== 0" class="notification-actions">
        <button type="button" (click)="markAllAsRead(); $event.stopPropagation()">Mark read</button>
        <button type="button" (click)="markAllAsArchive(); $event.stopPropagation()">Clear</button>
      </div>
    </div>

    <ul *ngIf="notifications.length > 0" class="notification-list">
      <li
        *ngFor="let notification of notifications"
        [class.unread]="isNotificationUnread(notification)"
        (click)="openNotification(notification)">
        <span class="notification-icon">
          <i class="bi" [ngClass]="notificationIcon(notification)"></i>
        </span>

        <span class="user-stack" *ngIf="notification.userDetails.length > 0">
          <span class="user-avatar" *ngFor="let user of notification.userDetails | slice:0:2">
            <img *ngIf="user.profilePicture" [src]="user.profilePicture" referrerpolicy="no-referrer">
            <span *ngIf="!user.profilePicture">{{ getInitials(user) }}</span>
          </span>
        </span>

        <div class="notification-copy">
          <p>{{ generateMessage(notification) }}</p>
          <small>{{ getTimeAgo(notification.timestamp) }}</small>
        </div>

        <button
          class="notification-dismiss"
          type="button"
          title="Clear notification"
          (click)="markAsArchive(notification); $event.stopPropagation()">
          <i class="bi bi-x"></i>
        </button>
      </li>
    </ul>

    <div *ngIf="notifications.length === 0" class="empty-notifications">
      <i class="bi bi-bell-slash"></i>
      <p>No new notifications</p>
    </div>
  </div>
</div>
