<div class="cst-modal share-modal modal fade" data-bs-backdrop="static" #shareModal id="shareModal"
    tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header modal__header__bg">
                <span>Share Moment</span>
                <button type="button" class="sm-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="modal-body">

                <!-- Two-column: QR + Sharing -->
                <div class="sm-grid">

                    <!-- QR Code -->
                    <div class="sm-qr">
                        <div class="sm-qr__code">
                            <qrcode #qrcodeElement (qrCodeURL)="onChangeURL($event)"
                                [qrdata]="sharedWallUrl" [colorLight]="'#ffffffff'"
                                [allowEmptyString]="true" [width]="156" [errorCorrectionLevel]="'M'"
                                [imageSrc]="'assets/images/momenta/momenta-icon.png'"
                                [imageHeight]="42" [imageWidth]="44">
                            </qrcode>
                        </div>
                        <div class="sm-qr__actions">
                            <button type="button" class="sm-icon-btn" (click)="copyQRCodeToClipboard()"
                                [disabled]="isqrCopied" aria-label="Copy QR code">
                                <i class="bi bi-copy"></i>
                            </button>
                            <button type="button" class="sm-icon-btn" (click)="saveAsImage()"
                                aria-label="Download QR code">
                                <i class="bi bi-download"></i>
                            </button>
                        </div>
                        @if (qrCopied) {
                            <p class="sm-feedback" [class.sm-feedback--ok]="isqrCopied">{{ qrCopied }}</p>
                        }
                    </div>

                    <!-- Share panel -->
                    <div class="sm-share">
                        <p class="sm-label">Share via</p>
                        <div class="sm-socials">
                            <button type="button" class="circle" (click)="shareFacebook()" aria-label="Facebook">
                                <i class="bi bi-facebook"></i>
                            </button>
                            <button type="button" class="circle" (click)="shareTwitter()" aria-label="Twitter">
                                <i class="bi bi-twitter-x"></i>
                            </button>
                            <button type="button" class="circle" (click)="shareLinkedIn()" aria-label="LinkedIn">
                                <i class="bi bi-linkedin"></i>
                            </button>
                            <button type="button" class="circle" (click)="shareWhatsApp()" aria-label="WhatsApp">
                                <i class="bi bi-whatsapp"></i>
                            </button>
                        </div>

                        <button type="button" class="sm-copy-btn" (click)="copyLink()">
                            <i class="bi" [class.bi-check-lg]="isLinkCopied" [class.bi-link-45deg]="!isLinkCopied"></i>
                            {{ isLinkCopied ? 'Copied!' : 'Copy link' }}
                        </button>
                    </div>

                </div>

                <!-- Private invite (creator only) -->
                @if (isCreator) {
                    <div class="sm-divider"><span>Private invite</span></div>
                    <div class="sm-invite">
                        <div class="sm-invite__row">
                            <input type="email" class="sm-invite__input" placeholder="Enter email address"
                                [(ngModel)]="inviteEmail" (keyup.enter)="generateInviteLink()" />
                            <button type="button" class="sm-invite__btn"
                                (click)="generateInviteLink()"
                                [disabled]="isGenerating || !inviteEmail">
                                {{ isGenerating ? '…' : 'Invite' }}
                            </button>
                        </div>
                        @if (inviteLink) {
                            <div class="sm-invite__result">
                                <input type="text" class="sm-invite__input sm-invite__input--link"
                                    [value]="inviteLink" readonly />
                                <button type="button" class="sm-invite__copy" (click)="copyInviteLink()">
                                    <i class="bi" [class.bi-check-lg]="inviteCopied" [class.bi-copy]="!inviteCopied"></i>
                                    {{ inviteCopied ? 'Copied' : 'Copy' }}
                                </button>
                            </div>
                        }
                    </div>
                }

            </div>
        </div>
    </div>
</div>
