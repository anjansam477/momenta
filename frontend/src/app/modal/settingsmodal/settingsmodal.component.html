<div class="cst-modal settings-modal modal fade" data-bs-backdrop="static" #settingsModal id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header modal__header__bg">
        Settings <i class="bi bi-x-lg" data-bs-dismiss="modal"></i>

        <!-- <h1 class="fs-5">{{ imageChangedEvent ? 'Profile Image Crop' : 'Settings' }}</h1>
        <button type="button" class="custom-close-button" data-bs-dismiss="modal" title="Close"></button> -->
      </div>
      <div class="modal-body">
        <div *ngIf="imageChangedEvent" >
          <image-cropper
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="1 / 1"
            format="png"
            class="custom-cropper"
            (imageCropped)="imageCropped($event)">
          </image-cropper>
          <button type="button" class="btn btn-primary mt-3" (click)="uploadProfilePic()">Upload</button>
          <button type="button" class="btn btn-light mt-3 ms-3" title="Close" (click)="resetImageChangeEvent()" >Cancel</button>
        </div>
        <div class="settings" *ngIf="!imageChangedEvent">
          <div class="profile-wrapper">
            <div class="profile-picture">
              <img *ngIf="croppedImage || image" [src]="croppedImage || image" referrerpolicy="no-referrer">
              <i *ngIf="!(croppedImage || image)" class="bi bi-person-fill profile-fallback-icon"></i>
            </div>
            <div class="profile-button-wrapper">
              <label for="profilePictureInput" class="edit-button" data-bs-toggle="tooltip" title="Upload new Image">
                <i class="bi bi-camera"></i>
                <input id="profilePictureInput" type="file" style="display: none;" accept="image/*" (change)="fileChangeEvent($event)">
              </label>
              @if(!defaultProfile){
                <label class="edit-button" data-bs-toggle="tooltip" title="Remove profile Image" (click)="removeProfilePicture()">
                  <i class="bi bi-trash"></i>
                </label>
              }
            </div>
          </div>
          <div class="user-info">
            <div class="form-group">
              <label for="name">Name</label>
              <div class="input-group justify-content-between">
                <input class="form-control"  *ngIf="editMode || incorrect" type="text" id="name" name="name"
                    [(ngModel)]="fullName" [ngClass]="{ 'validation-input': incorrect }" required>
                <span *ngIf="!editMode && !incorrect">{{ fullName }}</span>
                <button type="button" id="edit-name" (click)="toggleNameEditMode()">
                  @if(editMode || incorrect){
                    <span>Save</span>
                  }@else {
                    <i class="bi bi-pencil-square"></i>
                  }                
                </button> 
                <div class="validation-text" *ngIf="incorrect">
                  Both firstname and lastname are required and should be between 3-30 characters.
                </div>                          
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-group">
              <span>{{ userData.email }}</span>
              <span class="status-icon" data-bs-toggle="tooltip" [title]="userData.active ? 'Verified' : 'Not Verified'">
                <i class="bi {{ userData.active ? 'bi-check-circle-fill done-icon' : 'bi-x-circle-fill' }}"></i>
              </span>
            </div>
          </div>
          <div class="form-group">
            <label for="createdAt">Joined Since</label>
            <div class="input-group">
              <span>{{ userData.createdAt | date:'medium'}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
