<div class="gif-modal container-fluid">
    <div class="wrapper">
        <div class="search-wrap mb-2">
            <div class="search-bar">
                <i class="bi bi-filetype-gif search-icon-left"></i>
                <input #searchInput type="text" placeholder="Search GIFs…" class="search-input"
                    [(ngModel)]="searchTerm" (keyup.enter)="searchGifs()" (input)="onChange()" autocomplete="off" />
                <button type="button" class="search-btn" (click)="searchGifs()" aria-label="Search GIFs">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            @if (errorMessage) {
                <div class="validation-text mt-1 px-1">{{ errorMessage }}</div>
            }
        </div>

        <!-- Trending search suggestions -->
        @if (suggestions.length && !searchTerm) {
            <div class="suggestions">
                @for (s of suggestions; track s) {
                    <button type="button" class="suggestion-chip" (click)="searchGifs(s)">{{ s }}</button>
                }
            </div>
        }

        <div class="searched_content">
            @if (loading) {
                <div class="loader-wrap">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                </div>
            } @else if (receivedGifs && gifs.length) {
                @for (gif of gifs; track gif.id) {
                    <div class="pic" (click)="selectGif(gif)" [title]="gif.title || gif.alt_text || 'GIF'">
                        <!-- Show still first, swap to animated on hover -->
                        <img [src]="stillUrl(gif)" [attr.data-src]="thumbUrl(gif)"
                             [alt]="gif.alt_text || gif.title || 'GIF'"
                             (mouseenter)="$any($event.target).src = thumbUrl(gif)"
                             (mouseleave)="$any($event.target).src = stillUrl(gif)"
                             loading="lazy" />
                    </div>
                }
            } @else if (!receivedGifs) {
                <div class="empty-state">
                    <i class="bi bi-emoji-frown"></i>
                    <span>No GIFs found</span>
                </div>
            } @else {
                <div class="empty-state">
                    <i class="bi bi-filetype-gif"></i>
                    <span>Trending GIFs</span>
                </div>
            }
        </div>
    </div>
</div>
