@if (isMomentReady) {
  @if (checkWallCreator() && !isPreview) { <app-wall-navbar></app-wall-navbar> }
  <div class="moment-page wall-page" [ngStyle]="{'background-image': 'url(' + selectedBackground + ')'}">
    <app-title-bar></app-title-bar>
    <app-wall-posts></app-wall-posts>
  </div>
} @else {
  <div class="moment-loading-shell">
    <div class="moment-loading-card">
      <span class="moment-loading-icon"><i class="bi bi-stars"></i></span>
      <strong>Opening moment</strong>
      <p>Getting the celebration ready...</p>
    </div>
  </div>
}
