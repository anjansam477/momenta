<section class="login-page-card">
  <div class="brand-lockup">
    <img src="assets/images/momenta/momenta-logo-horizontal.png" alt="Momenta">
  </div>

  <div class="login-copy">
    <span class="eyebrow"><i class="bi bi-stars"></i> Welcome back</span>
    <h1>Sign in to Momenta</h1>
    <p>Continue creating thoughtful moments, shared memories, and celebrations that feel personal.</p>
  </div>

  <button type="button" class="google-login-button" (click)="googleLogin()">
    <i class="bi bi-google"></i>
    <span>Continue with Google</span>
  </button>

  <div class="privacy-note">
    <i class="bi bi-shield-check"></i>
    <span>Your account stays connected to your verified Google identity.</span>
  </div>
</section>
