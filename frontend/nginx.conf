server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (safe, non-breaking) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy — ENFORCING. Violations are now blocked, not just
    # reported. `connect-src` assumes the API + websocket are same-origin ('self',
    # i.e. nginx proxies /api on this domain) plus Giphy; `wss:` covers the
    # realtime socket. If your API lives on a DIFFERENT origin in production, add
    # that exact origin to connect-src or requests will be blocked. After deploy,
    # watch the browser console for CSP violations and widen a directive if a
    # legitimate origin was missed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.giphy.com https://*.googleusercontent.com; connect-src 'self' https://api.giphy.com https://*.giphy.com http://localhost:8071 ws://localhost:8071 wss:; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted build assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing — everything else falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
