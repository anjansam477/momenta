server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (safe, non-breaking) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy in REPORT-ONLY mode: it never blocks anything, it
    # only reports violations to the browser console / report-uri. This is the
    # safe way to inventory origins. Tune the directives below against real
    # reports (especially connect-src for your API + websocket origin), and once
    # you see zero violations, rename the header to "Content-Security-Policy" to
    # enforce. `${...}`-style hosts are placeholders — replace with your real
    # API/UI origins per environment (this file is static).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.giphy.com https://*.googleusercontent.com; connect-src 'self' https://api.giphy.com https://*.giphy.com http://localhost:8071 ws://localhost:8071 wss:; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted build assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing — everything else falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
