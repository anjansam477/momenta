name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (lint-if-present + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      # environment-config.ts is gitignored (holds env-specific URLs) — provide
      # the example so the build can resolve it on a clean checkout.
      - run: cp src/app/environment-config.example.ts src/app/environment-config.ts
      - run: npm run lint --if-present
      - run: npm run build

  e2e:
    name: Frontend E2E (Playwright smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: cp src/app/environment-config.example.ts src/app/environment-config.ts
      # Pixel 7 project reuses the chromium engine, so one browser covers both.
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer config starts `ng serve` itself (CI=1 → no reuse).
      # Only smoke specs run — auth/download specs are test.skip scaffolds.
      - run: npx playwright test smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
